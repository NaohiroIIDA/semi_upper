[env:bluepill_f103c8]
platform = ststm32
board = bluepill_f103c8
framework = arduino



lib_deps =
  # RECOMMENDED
  # Accept new functionality in a backwards compatible manner and patches
  exothink/eXoCAN @ ^1.0.3


  
; change microcontroller
board_build.mcu = stm32f103c8t6

upload_protocol = stlink
